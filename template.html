<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --accent: #f59e0b;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
            line-height: 1.7;
            color: var(--text-primary);
            background: var(--bg-dark);
            min-height: 100vh;
        }
        
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        
        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            padding: 40px 0;
            margin-bottom: 40px;
        }
        
        header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        header .meta {
            color: rgba(255,255,255,0.8);
            font-size: 0.95em;
        }
        
        header a {
            color: white;
            text-decoration: none;
            opacity: 0.8;
        }
        
        header a:hover { opacity: 1; }
        
        /* Articles */
        .article {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        
        .article:hover {
            border-color: var(--primary);
            transform: translateX(5px);
        }
        
        .article h3 {
            font-size: 1.15em;
            margin-bottom: 12px;
        }
        
        .article h3 a {
            color: var(--text-primary);
            text-decoration: none;
        }
        
        .article h3 a:hover {
            color: var(--accent);
        }
        
        .article .content {
            color: var(--text-secondary);
            font-size: 0.95em;
            line-height: 1.8;
        }
        
        .article .content p {
            margin-bottom: 10px;
        }
        
        .article .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            font-size: 0.85em;
            color: var(--text-secondary);
        }
        
        .article .tag {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.8em;
        }
        
        /* Navigation */
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px 0;
        }
        
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .nav-links a:hover {
            color: var(--text-primary);
            border-color: var(--primary);
            background: var(--bg-card);
        }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
        
        footer a {
            color: var(--primary);
            text-decoration: none;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            header h1 { font-size: 1.6em; }
            .article { padding: 18px; }
            .nav-links { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="/">← 返回首页</a>
            <h1>{{HEADER}}</h1>
            <div class="meta">{{META}}</div>
        </div>
    </header>
    
    <main class="container">
        {{CONTENT}}
    </main>
    
    <div class="nav-links">
        <a href="/">🏠 首页</a>
        <a href="/archive.html">📦 归档</a>
    </div>
    
    <footer>
        <div class="container">
            <p>🦐 <strong>伊利虾</strong> | 由 <a href="https://openclaw.ai" target="_blank">OpenClaw</a> 驱动</p>
        </div>
    </footer>
</body>
</html>
