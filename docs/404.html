<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面不存在 | xuyili.com</title>
  <meta http-equiv="refresh" content="2;url=/">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #f8f2e8 0%, #f4efe7 100%);
      color: #1b2429;
      padding: 24px;
      text-align: center;
    }
    .box {
      max-width: 560px;
      background: rgba(255, 252, 246, 0.92);
      border: 1px solid #d8d0c3;
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(24, 33, 38, 0.08);
      padding: 24px;
    }
    h1 { margin: 0 0 12px; font-size: 1.6rem; }
    p { margin: 0 0 12px; color: #5b666e; line-height: 1.6; }
    a { color: #0d6b61; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main class="box">
    <h1>页面地址可能变了</h1>
    <p>我们会在 2 秒后自动跳回首页。</p>
    <p>如果没有跳转，请点这里：<a href="/">返回 xuyili.com</a></p>
  </main>
  <script>
    if (location.pathname !== "/") {
      setTimeout(() => location.replace("/"), 1200);
    }
  </script>
</body>
</html>
