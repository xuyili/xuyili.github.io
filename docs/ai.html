<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <title>AI RSS Digest | xuyili.com</title>
    <style>
        :root {
            --bg: #f4efe7;
            --paper: rgba(255, 252, 246, 0.92);
            --ink: #192126;
            --muted: #5b666e;
            --line: #d8d0c3;
            --accent: #0d6b61;
            --accent-soft: #d9eee8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Iowan Old Style", "Palatino Linotype", serif;
            line-height: 1.7;
            color: var(--ink);
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(13, 107, 97, 0.14), transparent 28%),
                linear-gradient(180deg, #f8f2e8 0%, var(--bg) 100%);
            padding: 32px 20px 56px;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
        }

        .back {
            margin-bottom: 18px;
        }

        .back a {
            color: var(--accent);
            text-decoration: none;
            font: 600 0.98rem/1.4 system-ui, sans-serif;
        }

        .hero,
        .panel,
        .entry {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 24px 50px rgba(24, 33, 38, 0.07);
            backdrop-filter: blur(8px);
        }

        .hero {
            padding: 34px 30px;
            margin-bottom: 22px;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 16px;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font: 700 0.82rem/1.2 system-ui, sans-serif;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(2.6rem, 5vw, 4.4rem);
            line-height: 0.95;
            letter-spacing: -0.05em;
            margin-bottom: 14px;
        }

        .lede {
            color: var(--muted);
            font-size: 1.08rem;
            max-width: 60ch;
        }

        .panel {
            padding: 24px 26px;
            margin-bottom: 20px;
        }

        .panel h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .panel p,
        .panel li {
            color: var(--muted);
        }

        .panel ul {
            padding-left: 20px;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .meta-card {
            padding: 14px 16px;
            border-radius: 18px;
            background: rgba(13, 107, 97, 0.05);
        }

        .meta-card strong {
            display: block;
            margin-bottom: 4px;
            color: var(--ink);
            font: 700 0.92rem/1.3 system-ui, sans-serif;
        }

        #digest {
            display: grid;
            gap: 18px;
        }

        .entry {
            padding: 24px 24px 20px;
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .entry-index {
            min-width: 2.4rem;
            height: 2.4rem;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font: 700 1rem/2.4rem system-ui, sans-serif;
            text-align: center;
        }

        .entry h3 {
            font-size: 1.34rem;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .entry .title-en,
        .entry .title-zh {
            margin-bottom: 8px;
        }

        .entry .title-zh {
            color: var(--accent);
            font-size: 1.06rem;
            margin-bottom: 14px;
        }

        .entry .summary-en,
        .entry .summary-zh {
            color: var(--muted);
            margin-bottom: 10px;
        }

        .entry .summary-label,
        .entry .meta {
            font: 600 0.92rem/1.4 system-ui, sans-serif;
        }

        .entry .meta {
            color: var(--muted);
            margin-top: 14px;
        }

        .entry a {
            color: var(--accent);
            text-decoration: none;
        }

        .entry a:hover {
            text-decoration: underline;
        }

        .empty {
            text-align: center;
            color: var(--muted);
        }

        @media (max-width: 768px) {
            body { padding: 18px 12px 40px; }
            .hero, .panel, .entry { border-radius: 20px; }
            .hero { padding: 28px 20px; }
            .panel { padding: 20px; }
            .entry { padding: 20px 18px 18px; }
            .entry-header { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back"><a href="/index.html">← 返回首页</a></div>

        <section class="hero">
            <span class="eyebrow">Daily AI RSS Digest</span>
            <h1>AI Digest</h1>
            <p class="lede">每天从订阅 RSS 中筛出最相关的 AI 内容，保留英文标题与摘要，并提供中文对照。页面数据由自动化任务每日覆盖更新。</p>
        </section>

        <section class="panel">
            <h2>更新规则</h2>
            <p>只保留与 AI 最相关、信息密度最高的内容，优先模型、产品、Agent、安全、工具链和产业动态。每条均展示英文原题、中文标题、英文摘要、中文摘要。</p>
            <div class="meta-grid">
                <div class="meta-card">
                    <strong>更新频率</strong>
                    <span>每日一次</span>
                </div>
                <div class="meta-card">
                    <strong>内容形式</strong>
                    <span>中英文对照</span>
                </div>
                <div class="meta-card">
                    <strong>来源范围</strong>
                    <span>你的 RSS 清单</span>
                </div>
            </div>
        </section>

        <section class="panel">
            <h2>Latest Picks</h2>
            <div id="digest">
                <div class="empty">
                    <p>尚未生成今日摘要。</p>
                </div>
            </div>
        </section>
    </div>

    <script>
        function escapeHtml(text) {
            return String(text ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        async function loadDigest() {
            const container = document.getElementById("digest");

            try {
                const response = await fetch("./ai-rss-digest.json", { cache: "no-store" });
                if (!response.ok) throw new Error("Digest file not found");

                const data = await response.json();
                const items = Array.isArray(data.items) ? data.items : [];

                if (!items.length) {
                    return;
                }

                container.innerHTML = items.map((item, index) => `
                    <article class="entry">
                        <div class="entry-header">
                            <div>
                                <p class="title-en"><span class="summary-label">EN:</span> <a href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">${escapeHtml(item.title_en)}</a></p>
                                <p class="title-zh"><span class="summary-label">中:</span> ${escapeHtml(item.title_zh)}</p>
                            </div>
                            <div class="entry-index">${index + 1}</div>
                        </div>
                        <p class="summary-en"><span class="summary-label">EN:</span> ${escapeHtml(item.summary_en)}</p>
                        <p class="summary-zh"><span class="summary-label">中:</span> ${escapeHtml(item.summary_zh)}</p>
                        <p class="meta">${escapeHtml(item.source)} · ${escapeHtml(item.date)}</p>
                    </article>
                `).join("");
            } catch (_error) {
                container.innerHTML = `
                    <div class="empty">
                        <p>今日摘要尚未写入，请等待自动化任务完成。</p>
                    </div>
                `;
            }
        }

        loadDigest();
    </script>
</body>
</html>
