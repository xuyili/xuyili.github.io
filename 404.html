<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f7">
  <title>页面不存在 | xuyili.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f7;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0071e3;
      --accent-2: #5e5ce6;
      --line: rgba(29, 29, 31, 0.08);
      --shadow: 0 20px 56px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(94, 92, 230, 0.10), transparent 28%),
        radial-gradient(circle at 80% 10%, rgba(0, 113, 227, 0.08), transparent 28%),
        linear-gradient(180deg, #fcfcfd 0%, var(--bg) 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(29, 29, 31, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(29, 29, 31, 0.03) 1px, transparent 1px);
      background-size: 52px 52px;
      opacity: 0.30;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.5), transparent 90%);
    }

    .card {
      width: min(100%, 620px);
      position: relative;
      overflow: hidden;
      padding: clamp(24px, 4vw, 36px);
      border-radius: 28px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(18px) saturate(1.2);
      box-shadow: var(--shadow);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: auto -10% -12% auto;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 113, 227, 0.10), rgba(0, 113, 227, 0.02) 45%, transparent 72%);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(0, 113, 227, 0.14);
      background: rgba(0, 113, 227, 0.06);
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(2.4rem, 7vw, 4.8rem);
      line-height: 0.98;
      letter-spacing: -0.07em;
      color: #111114;
    }

    p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.8;
      font-size: 1rem;
    }

    .terminal {
      margin-top: 18px;
      border-radius: 22px;
      padding: 16px;
      border: 1px solid rgba(29, 29, 31, 0.08);
      background: linear-gradient(180deg, #111114 0%, #1a1a1f 100%);
      color: #f5f5f7;
      overflow: hidden;
      position: relative;
      font-family: "SF Mono", "JetBrains Mono", monospace;
    }

    .terminal::after {
      content: "";
      position: absolute;
      inset: -30% 0 auto;
      height: 50%;
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.08), transparent);
      animation: scan 7s linear infinite;
      pointer-events: none;
    }

    .line {
      margin: 0;
      position: relative;
      z-index: 1;
      padding: 0.3rem 0;
      font-size: 0.9rem;
    }

    .line .ok { color: #34c759; margin-right: 8px; }
    .line .warn { color: #ff9f0a; margin-right: 8px; }
    .line .prompt { color: #7dd3fc; margin-right: 8px; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    a { text-decoration: none; color: inherit; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0.9rem 1.15rem;
      border-radius: 999px;
      font-weight: 700;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 16px 30px rgba(0, 113, 227, 0.18);
    }

    .btn-secondary {
      color: var(--text);
      border: 1px solid rgba(29, 29, 31, 0.10);
      background: rgba(255, 255, 255, 0.78);
    }

    .hint {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(29, 29, 31, 0.08);
      color: var(--muted);
      font-size: 0.92rem;
    }

    @keyframes scan {
      0% { transform: translateY(-120%); opacity: 0; }
      15% { opacity: 1; }
      60% { transform: translateY(500%); opacity: 0.8; }
      100% { transform: translateY(1000%); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    @media (max-width: 520px) {
      .actions { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">xuyili.com · fallback</div>
    <h1>页面可能已经更新</h1>
    <p>我会先把你带回首页；如果你访问的是旧链接，系统会尽量自动找回最新页面。</p>

    <div class="terminal" aria-label="fallback status">
      <p class="line"><span class="prompt">$</span> checking route…</p>
      <p class="line"><span class="ok">[ok]</span> custom domain active</p>
      <p class="line"><span class="warn">[sync]</span> trying to recover latest page</p>
      <p class="line"><span class="ok">[ok]</span> redirecting to homepage</p>
    </div>

    <div class="actions">
      <a class="btn btn-primary" href="/">返回 xuyili.com</a>
      <a class="btn btn-secondary" href="/archive.html">去归档页</a>
    </div>

    <div class="hint">2 秒后自动跳转到首页</div>
  </main>

  <script>
    const normalize = (path) => {
      if (!path || path === '/') return '/';
      return path.endsWith('/') ? path.slice(0, -1) : path;
    };

    const current = normalize(location.pathname);
    const candidates = [current, `${current}.html`, `${current}/index.html`, '/index.html', '/'];

    async function check(path) {
      try {
        const res = await fetch(path, { method: 'HEAD' });
        return res.ok ? path : null;
      } catch {
        return null;
      }
    }

    (async () => {
      for (const candidate of candidates) {
        const ok = await check(candidate);
        if (ok && ok !== location.pathname) {
          setTimeout(() => location.replace(ok === '/index.html' ? '/' : ok), 900);
          return;
        }
      }
      setTimeout(() => location.replace('/'), 900);
    })();
  </script>
</body>
</html>
